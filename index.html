<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101522">
  <title>ChatGPT Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <header class="topbar">
      <div class="brand"><span class="brand-icon">✳</span><div><h1>Calculator</h1><p>Simple. Smart. Beautiful.</p></div></div>
      <button class="theme-btn" id="themeBtn" aria-label="Toggle theme">☼</button>
    </header>
    <section class="display" aria-live="polite">
      <div class="history" id="history"></div>
      <div class="output" id="output">0</div>
    </section>
    <section class="keys" aria-label="Calculator keys">
      <button class="key utility" data-action="clear">AC</button>
      <button class="key utility" data-action="delete">⌫</button>
      <button class="key utility" data-value="%">%</button>
      <button class="key operator" data-value="÷">÷</button>
      <button class="key" data-value="7">7</button><button class="key" data-value="8">8</button><button class="key" data-value="9">9</button><button class="key operator" data-value="×">×</button>
      <button class="key" data-value="4">4</button><button class="key" data-value="5">5</button><button class="key" data-value="6">6</button><button class="key operator" data-value="-">−</button>
      <button class="key" data-value="1">1</button><button class="key" data-value="2">2</button><button class="key" data-value="3">3</button><button class="key operator" data-value="+">+</button>
      <button class="key utility" data-action="sign">+/−</button><button class="key" data-value="0">0</button><button class="key" data-value=".">.</button><button class="key equals" data-action="equals">=</button>
    </section>
    <footer>Made with HTML, CSS &amp; JavaScript</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
